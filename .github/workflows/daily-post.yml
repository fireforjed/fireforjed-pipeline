name: Daily Forjed Post

on:
  schedule:
    # Checks once a day at 4:00 AM Pacific (11:00 UTC during PDT; change the
    # "11" to "12" when clocks fall back in November, and back in spring).
    # The "Check 48-hour gap" step below makes the job actually post only
    # every other day: on the in-between days it skips everything.
    - cron: "0 11 * * *"
  workflow_dispatch: {}  # manual runs from the Actions tab always post, ignoring the gap

permissions:
  contents: write

env:
  MIN_HOURS_BETWEEN_POSTS: 46  # a 48-hour cadence, with slack for GitHub's cron delays

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need history to find the last auto-post
          persist-credentials: true

      - name: Check 48-hour gap
        id: gate
        run: |
          # Manual runs always go through.
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Manual run - posting regardless of the gap."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          last_ts=$(git log --grep="^Auto-post:" -1 --format=%ct)
          if [ -z "$last_ts" ]; then
            echo "No previous auto-post found - posting."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          now_ts=$(date +%s)
          hours_since=$(( (now_ts - last_ts) / 3600 ))
          echo "Hours since last auto-post: $hours_since (minimum: $MIN_HOURS_BETWEEN_POSTS)"

          if [ "$hours_since" -lt "$MIN_HOURS_BETWEEN_POSTS" ]; then
            echo "Too soon - skipping today."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Generate post image
        if: steps.gate.outputs.skip != 'true'
        id: generate
        run: python scripts/generate_post.py

      - name: Commit and push generated image + updated state
        if: steps.gate.outputs.skip != 'true'
        run: |
          git config user.name "forjed-bot"
          git config user.email "forjed-bot@users.noreply.github.com"
          git add posts/ quote_state.json
          git commit -m "Auto-post: Quote ${{ steps.generate.outputs.quote_id }}"
          git push

      - name: Publish to Facebook and Instagram
        if: steps.gate.outputs.skip != 'true'
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IMAGE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/posts/${{ steps.generate.outputs.image_filename }}
          CAPTION: ${{ steps.generate.outputs.caption }}
        run: python scripts/publish_post.py
