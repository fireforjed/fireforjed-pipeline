name: Daily Forjed Post

on:
  schedule:
    # 4:00 AM Pacific. GitHub Actions cron runs on fixed UTC time, and
    # Pacific shifts between UTC-7 (PDT, roughly Mar-Nov) and UTC-8 (PST,
    # roughly Nov-Mar). This is currently set for PDT (UTC-7), i.e. 11:00
    # UTC = 4:00 AM PDT. When clocks fall back in November, this will
    # start firing at 3:00 AM Pacific instead of 4:00 -- change the "11"
    # below to "12" at that point (and back to "11" in spring) if you
    # want to keep it pinned to exactly 4:00 AM local time year-round.
    - cron: "0 11 * * *"
  workflow_dispatch: {}  # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate post image
        id: generate
        run: python scripts/generate_post.py

      - name: Commit and push generated image + updated state
        run: |
          git config user.name "forjed-bot"
          git config user.email "forjed-bot@users.noreply.github.com"
          git add posts/ quote_state.json
          git commit -m "Auto-post: Quote ${{ steps.generate.outputs.quote_id }}"
          git push

      - name: Publish to Facebook and Instagram
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IMAGE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/posts/${{ steps.generate.outputs.image_filename }}
          CAPTION: ${{ steps.generate.outputs.caption }}
        run: python scripts/publish_post.py
